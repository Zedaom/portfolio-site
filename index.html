<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moacyr Neto | Motion Design & 2D Animation</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Outfit:wght@300;400&family=Boldonse&display=swap" rel="stylesheet">
  <style>
    :root{--bg-color:#000;--text-color:#E5E5E5;--accent-color:#FCA311;--secondary-color:#0a1020;--muted-color:#999;--glass-border:rgba(229,229,229,.1);--transition:all .5s cubic-bezier(.23,1,.32,1)}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{background:var(--bg-color);color:var(--text-color);overflow-x:hidden;line-height:1.6}
    .container{max-width:1200px;margin:0 auto;padding:0 20px}
    header{position:absolute;top:0;width:100%;padding:5px 0;z-index:1000;background:transparent;}
    @media (max-width:768px){header{position:fixed;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border)}}
    nav{display:flex;justify-content:space-between;align-items:center;margin-top:-15px}
    .menu-toggle{display:none;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:5px}
    .mobile-menu-logo{display:none}
    .logo-video-wrap{display:flex;align-items:center;height:120px}
    .logo-text{display:flex;align-items:center;text-decoration:none}
    .logo-star{width:120px;height:120px;object-fit:contain}
    .nav-links{display:flex;gap:30px;list-style:none}
    .nav-links a{text-decoration:none;color:var(--muted-color);font-weight:400;font-size:.9rem;transition:var(--transition)}
    .nav-links a:hover{color:var(--accent-color)}

    .hero{padding:95px 0 28px;display:flex;align-items:center;justify-content:center;background:var(--bg-color)}
    .hero .container{width:96vw;max-width:1900px;padding:0}
    .hero-card{position:relative;width:100%;border-radius:20px;overflow:hidden;height:calc(100vh - 130px);min-height:640px;border:1px solid var(--glass-border);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#0a0f1e}
    .hero-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(20,33,61,.55),rgba(0,0,0,.45));z-index:1}
    .hero-content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:12px}
    .hero-title{font-family:'Boldonse',sans-serif;font-size:2.25rem;line-height:1.2;letter-spacing:.1em}
    .hero-specs{font-size:.6rem;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.65)}
    .hero-cta-btn{padding:12px 28px;border-radius:50px;border:none;background:var(--accent-color);color:#fff;font-weight:700;font-size:.85rem;letter-spacing:1px;text-decoration:none;display:inline-block}

    .portfolio{padding:96px 0}
    .portfolio .container{width:80vw;max-width:1600px;padding:0}
    .section-header{margin-bottom:40px;text-align:center}
    .section-tag{color:var(--accent-color);font-weight:600;text-transform:uppercase;font-size:.8rem;letter-spacing:2px;margin-bottom:0;display:block}

    .project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
    .project-card{background:var(--secondary-color);border-radius:24px;overflow:hidden;border:1px solid var(--glass-border);transition:var(--transition);cursor:pointer}
    .project-card:hover{transform:translateY(-8px);border-color:var(--accent-color)}
    .project-image-container{position:relative;height:280px;overflow:hidden;background:#000}
    .project-image,.project-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .project-image{opacity:.65}
    .project-video{opacity:0;transition:opacity .35s ease}
    .project-video.loaded{opacity:1}
    .project-info{padding:24px}
    .project-category{font-size:.72rem;color:var(--accent-color);font-weight:600;text-transform:uppercase;display:block;margin-bottom:8px;letter-spacing:1px}
    .project-title{font-size:1.2rem;font-weight:800}

    .project-card.reel-card{grid-column:1/-1;display:grid;grid-template-columns:1.1fr .9fr;border-color:rgba(252,163,17,.25)}
    .project-card.reel-card .project-image-container{height:auto;min-height:0;aspect-ratio:16/9}
    .project-card.reel-card .project-info{display:flex;flex-direction:column;justify-content:center;padding:44px;gap:14px}
    .reel-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,163,17,.12);border:1px solid rgba(252,163,17,.35);border-radius:50px;padding:5px 14px;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent-color);width:fit-content}
    .reel-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent-color)}
    .reel-desc{font-size:.9rem;color:var(--muted-color);line-height:1.7}
    .reel-cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent-color);color:#000;font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;padding:12px 24px;border-radius:50px;width:fit-content}
    .reel-cta svg{width:14px;height:14px;fill:currentColor}

    footer{padding:64px 0 40px;text-align:center;border-top:1px solid var(--glass-border)}
    .social-links{display:flex;justify-content:center;gap:28px;margin-bottom:18px;flex-wrap:wrap}
    .social-link{display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;transition:var(--transition)}
    .social-link:hover{color:var(--accent-color)}
    .social-link svg{width:30px;height:30px;fill:currentColor}
    .footer-email{display:block;color:var(--accent-color);text-decoration:none;font-weight:600;letter-spacing:1px;font-size:.72rem;text-transform:uppercase;margin-bottom:28px}
    .footer-email:hover{opacity:.85}
    .footer-copy{color:#4a4a4a;letter-spacing:2px;text-transform:uppercase}

    #splash{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .9s cubic-bezier(.76,0,.24,1)}
    #splash.slide-up{transform:translateY(-100%)}
    .splash-logo{font-family:'Boldonse',sans-serif;font-size:clamp(2.5rem,8vw,6rem);color:#fff;display:flex;line-height:1}
    .splash-logo span{display:inline-block;opacity:0;transform:translateY(60px);animation:letterUp .6s cubic-bezier(.23,1,.32,1) forwards;font-family:'Boldonse',sans-serif}
    .splash-divider{display:flex;align-items:center;gap:14px;margin-top:16px;opacity:0;animation:fadeInSub .5s ease 1.1s forwards}
    .splash-line,.splash-line-right{height:1.5px;width:0;background:var(--accent-color);animation:lineExpand .6s ease 1s forwards}
    .splash-title{font-size:clamp(.65rem,1.5vw,.85rem);font-weight:400;letter-spacing:5px;text-transform:uppercase;color:var(--accent-color);white-space:nowrap}
    @keyframes letterUp{to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInSub{to{opacity:1}}
    @keyframes lineExpand{to{width:55px}}
    .reveal{opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.23,1,.32,1)}
    .reveal.active{opacity:1;transform:translateY(0)}

    @media (max-width:1024px){
      .hero .container,.portfolio .container{width:92vw}
      .project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:768px){
      .logo-video-wrap{height:100px}.logo-star{width:100px;height:100px}
      .hero{padding:110px 0 15px}.hero .container,.portfolio .container{width:100%;padding:0 20px}
      .hero-card{height:calc(100vh - 135px);min-height:0;border-radius:18px}
      .hero-title{font-size:5vw}.hero-specs{font-size:.5rem;letter-spacing:1.5px}
      .menu-toggle{display:block;z-index:1100;position:relative}
      .nav-links{display:none;flex-direction:column;position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,.97);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);padding:0;gap:12px;border-top:none;z-index:1050;justify-content:center;align-items:center}
      .nav-links.open{display:flex}
      .nav-links li{text-align:center;opacity:0;transform:translateY(20px);animation:menuItemIn .4s cubic-bezier(.23,1,.32,1) forwards;list-style:none}
      .nav-links li:nth-child(1){animation-delay:.1s}
      .nav-links li:nth-child(2){animation-delay:.2s}
      .nav-links li:nth-child(3){animation-delay:.3s}
      .nav-links a{font-size:2rem;font-weight:600;color:var(--text-color);transition:color .2s ease;padding:12px 24px;display:block}
      .nav-links a:active,.nav-links a.nav-tapped{color:var(--accent-color)}
      .mobile-menu-logo{display:none;position:absolute;top:12px;left:20px;width:100px;height:100px;object-fit:contain;z-index:1060}
      .nav-links.open~.mobile-menu-logo,.nav-links.open+.mobile-menu-logo{display:block}
      @keyframes menuItemIn{to{opacity:1;transform:translateY(0)}}
      .project-grid{grid-template-columns:1fr;gap:22px}
      .project-image-container{height:220px}
      .project-card.reel-card{grid-template-columns:1fr}
      .project-card.reel-card .project-image-container{aspect-ratio:auto;height:220px}
      .project-card.reel-card .project-info{padding:28px}
      .splash-logo{font-size:clamp(2.2rem,13vw,3.5rem)}
      .splash-title{font-size:.65rem;letter-spacing:3px}
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">
      <span style="animation-delay:0.1s">M</span><span style="animation-delay:0.18s">O</span><span style="animation-delay:0.26s">A</span>
    </div>
    <div class="splash-divider">
      <div class="splash-line"></div>
      <div class="splash-title">Motion Design &amp; 2D Artist</div>
      <div class="splash-line-right"></div>

  </div>

        <div class="logo-video-wrap">

          <li><a href="#portfolio" onclick="handleMenuLink(event, '#portfolio')">Portfolio</a></li>
          <li><a href="about.html" onclick="handleMenuLink(event, 'about.html')">About</a></li>
          <li><a href="contact.html" onclick="handleMenuLink(event, 'contact.html')">Contact</a></li>
        </ul>
        <video class="mobile-menu-logo" autoplay loop muted playsinline style="pointer-events:none;"><source src="Logo_Animada_Versao_clara.webm" type="video/webm"></video>

    </div>
  </header>

  <section class="hero">

      <div class="hero-card reveal">
        <video class="hero-bg-video" autoplay muted loop playsinline>
          <source src="hero-bg.mov" type='video/mp4; codecs="hvc1"'>

        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h1 class="hero-title">MOACYR NETO</h1>

          <a href="#portfolio" class="hero-cta-btn">Explore Projects</a>
        </div>
      </div>
    </div>
  </section>

  <section id="portfolio" class="portfolio">
    <div class="container">

      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>

  <script>
    const REEL = {
      title: "Clean Up",
      category: "Demo Reel",
      thumb: "CleanUpReelCapa.jpg",
      page: "project-demo-reel-clean.html",
      desc: "A compilation of clean up work across multiple projects — base color, lighting and shadow passes in Toon Boom Harmony."
    };

    const PROJECTS = [
      { title:"Impossible Journey", category:"Clean Up", thumb:"ImpossibleJourneyCapa.jpeg", recorte:"Impossible_Journey_Recorte", page:"project-impossible-journey.html" },
      { title:"The Lost Glitches", category:"Clean Up", thumb:"TheLostGlitchesCapa.jpg", recorte:"The_Lost_Glitches_Recorte", page:"project-the-lost-glitches.html" },
      { title:"Convergence", category:"Clean Up", thumb:"ConvergenceCapa.jpg", recorte:"Convergence_Recorte", page:"project-convergence.html" },
      { title:"Active Rings", category:"Clean Up", thumb:"ActiveRingsCapa.jpg", recorte:"Active_Rings_Recorte", page:"project-active-rings.html" },
      { title:"Havaianas", category:"Clean Up", thumb:"HavaianasCapa.jpg", recorte:"This_is_Havaianas_Recorte", page:"project-havaianas.html" },
      { title:"The Ring", category:"Clean Up", thumb:"TheRingCapa.jpg", recorte:"The_Ring_Recorte", page:"project-the-ring.html" },
      { title:"Tiger Beer", category:"Clean Up", thumb:"TigerBeerCapa.jpg", recorte:"Tiger_Beer_Recorte", page:"project-tiger-beer.html" },
      { title:"Just a Cube", category:"Motion Design", thumb:"JustACube_Capa.jpg", recorte:"Just_A_Cube_Recorte", page:"project-just-a-cube.html" },
      { title:"Open your eyes", category:"Motion Design", thumb:"OpenYourEyes_Capa.jpg", recorte:"Open_Your_Eyes_Recorte", page:"project-open-your-eyes.html" }
    ];

    function renderPortfolio() {
      const grid = document.getElementById('projectGrid');
      const reelCard = `
        <div class="project-card reel-card reveal" onclick="window.location.href='${REEL.page}'">
          <div class="project-image-container">
            <img src="${REEL.thumb}" alt="${REEL.title}" class="project-image">
            <video class="project-video" autoplay muted loop playsinline preload="metadata" oncanplay="this.classList.add('loaded')" onerror="this.remove()">
              <source src="Clean_up_Demo_Reel_Recorte_webm" type="video/webm">
              <source src="Clean_up_Demo_Reel_Recorte.webm" type="video/webm">
              <source src="Clean_up_Demo_Reel_Recorte.mp4" type="video/mp4">
            </video>
          </div>
          <div class="project-info">
            <span class="reel-badge">Demo Reel</span>
            <h3 class="project-title">${REEL.title}</h3>
            <p class="reel-desc">${REEL.desc}</p>
            <a href="${REEL.page}" class="reel-cta">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Watch Reel
            </a>
          </div>
        </div>`;

      const cards = PROJECTS.map((p) => `
        <div class="project-card reveal" onclick="window.location.href='${p.page}'">
          <div class="project-image-container">
            <img src="${p.thumb}" alt="${p.title}" class="project-image">
            <video class="project-video" autoplay muted loop playsinline preload="metadata" oncanplay="this.classList.add('loaded')" onerror="this.remove()">
              <source src="${p.recorte}.webm" type="video/webm">
              <source src="${p.recorte}.mp4" type="video/mp4">
            </video>
          </div>
          <div class="project-info">
            <span class="project-category">${p.category}</span>
            <h3 class="project-title">${p.title}</h3>
          </div>
        </div>`).join('');

      grid.innerHTML = reelCard + cards;
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function toggleMobileMenu(){
      const nav = document.querySelector('.nav-links');
      const btn = document.getElementById('menuToggleBtn');
      const logo = document.querySelector('.mobile-menu-logo');
      const isOpen = nav.classList.toggle('open');
      btn.textContent = isOpen ? '✕' : '☰';
      if(logo) logo.style.display = isOpen ? 'block' : 'none';
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }
    function closeMenu(){
      const nav = document.querySelector('.nav-links');
      const btn = document.getElementById('menuToggleBtn');
      const logo = document.querySelector('.mobile-menu-logo');
      nav.classList.remove('open');
      btn.textContent = '☰';
      if(logo) logo.style.display = 'none';
      document.body.style.overflow = '';
    }
    function handleMenuLink(e, href){
      if(window.innerWidth > 768) return;
      e.preventDefault();
      const link = e.currentTarget;
      link.classList.add('nav-tapped');
      setTimeout(() => {
        closeMenu();
        if(href.startsWith('#')){
          const el = document.querySelector(href);
          if(el) el.scrollIntoView({behavior:'smooth'});
        } else {
          window.location.href = href;
        }
      }, 250);
    }
    function scrollToTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -30px 0px" });

    (function splashIntro() {
      const splash = document.getElementById('splash');
      setTimeout(() => {
        splash.classList.add('slide-up');
        splash.addEventListener('transitionend', () => splash.remove(), { once: true });
      }, 2200);
    })();

    renderPortfolio();
  </script>
</body>
</html>
