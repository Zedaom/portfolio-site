<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just a Cube | Moacyr Neto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Outfit:wght@300;400&family=Boldonse&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E5E5E5;
            --accent-color: #FCA311;
            --secondary-color: #0a1020;
            --muted-color: #999999;
            --glass-border: rgba(229, 229, 229, 0.1);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .logo-text {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
        }

        .logo-star {
            width: 32px;
            height: 32px;
            fill: #fff;
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .logo-text:hover .logo-star {
            fill: var(--accent-color);
            transform: scale(1.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 4px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px;
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .project-hero {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .project-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 1;
        }

        .project-hero-info {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            z-index: 2;
        }

        .project-category-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .project-hero-title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1.05;
            color: #fff;
            letter-spacing: 0.05em;
        }

        .project-content {
            padding: 80px 0 120px;
        }

        .project-meta {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--glass-border);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 80px;
        }

        .meta-item {
            padding: 28px 32px;
            background: var(--bg-color);
        }

        .meta-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .meta-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .project-description {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 80px;
            align-items: start;
            margin-bottom: 80px;
        }

        .project-description h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            line-height: 1.1;
            letter-spacing: 0.02em;
            position: sticky;
            top: 100px;
        }

        .project-description h2 span {
            color: var(--accent-color);
        }

        .project-description p {
            font-size: 1.1rem;
            line-height: 1.9;
            opacity: 0.75;
            margin-bottom: 20px;
        }

        .section-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 60px 0;
        }

        .project-credits {
            padding: 80px 0;
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 260px;
            margin-top: 60px;
        }

        .credits-title {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted-color);
            margin-bottom: 32px;
        }

        .credits-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .credit-line {
            font-size: 0.95rem;
            color: var(--text-color);
            opacity: 0.75;
            line-height: 1.6;
        }

        .credit-line strong {
            font-weight: 400;
        }

        .project-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            padding: 48px 0;
        }

        .project-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--muted-color);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .project-nav a:hover {
            color: var(--accent-color);
        }

        .project-nav a svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .lang-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: white;
            padding: 10px 18px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
        }

        .lang-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            .lang-btn {
                top: 16px;
                right: 16px;
                padding: 8px 14px;
            }

            .back-btn {
                top: 16px;
                left: 16px;
                font-size: 0.75rem;
                padding: 8px 14px;
            }

            .project-hero {
                height: auto;
                display: flex;
                flex-direction: column;
            }

            .project-hero-img {
                position: static;
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
                object-fit: cover;
            }

            .project-hero-overlay {
                display: none;
            }

            .project-hero-info {
                position: static;
                padding: 20px 20px 0;
                background: var(--bg-color);
            }

            .project-hero-title {
                font-size: 1.8rem;
            }

            .project-content {
                padding: 30px 0 80px;
            }

            .project-meta {
                grid-template-columns: 1fr 1fr;
            }

            .meta-item {
                padding: 16px 18px;
            }

            .meta-value {
                font-size: 0.85rem;
                word-break: break-word;
            }

            .meta-label {
                font-size: 0.55rem;
            }

            .project-description {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .project-description h2 {
                position: static;
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
        <span class="back-label" data-i18n="back">Portfolio</span>
    </a>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">PT</button>



    <div class="project-content">
        <div class="container">

            <div class="reveal" style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 40px;">
                <!-- Vimeo Embed -->
                <iframe src="https://player.vimeo.com/video/1175227193?color=FCA311&title=0&byline=0&portrait=0" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="project-description reveal" style="max-width: 800px; margin: 0 auto; text-align: center; display: block;">
                <p data-i18n="sobre_p1" style="font-size: 1.1rem; line-height: 1.8; opacity: 0.8; margin-bottom: 0;">Art direction and animation by Moacyr Neto.</p>
            </div>

            <div class="project-nav reveal">
                <a href="index.html" id="prevProject">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                    Back to Portfolio
                </a>
            </div>

        </div>
    </div>

    <script>
        // Reveal observer
        const revealObs = new IntersectionObserver(
            entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); }),
            { threshold: 0.08 }
        );
        document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

        // i18n
        const T = {
            pt: { back: "Portfólio", sobre_p1:  "Exploração rítmica a partir de um cubo feita no Frame-a-frame e Pós-produção no After Effects" },
            en: { back: "Portfolio", sobre_p1: "Cube rhythmic exploration made Frame-by-frame and post-production in After Effects" }
        };

        let lang = 'en';
        function toggleLang() {
            lang = lang === 'pt' ? 'en' : 'pt';
            document.getElementById('langBtn').textContent = lang === 'pt' ? 'EN' : 'PT';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (T[lang][key]) {
                    el.textContent = T[lang][key];
                }
            });
        }
        
        // Inicializa com a linguagem padrão ou do navegador
        applyLang(lang);
        function applyLang(l) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (T[l][key]) {
                    el.textContent = T[l][key];
                }
            });
        }
    </script>
</body>
</html>
